<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Davince Visuals</title>
  <style>
    :root {
      --bg: #070d14;
      --surface: #121c2a;
      --text: #e8f0f7;
      --muted: #9cb0c4;
      --accent: #00b5ad;
      --accent2: #ff6600;
      --border: #263a50;
      --surface-highlight: rgba(0, 181, 173, 0.12);
      --focus-ring: rgba(0, 181, 173, 0.32);
    }
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 14% 10%, rgba(0, 181, 173, 0.2), transparent 42%),
        linear-gradient(180deg, #04080e 0%, var(--bg) 100%);
      color: var(--text);
      text-align: center;
      padding: 50px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background:
        linear-gradient(145deg, var(--surface-highlight), transparent 52%),
        var(--surface);
      padding: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 48px rgba(0,0,0,0.28);
    }
    h1 {
      color: var(--accent);
      margin-top: 0;
    }
    p { margin:20px 0; }
    .btn {
      display:inline-block;
      padding:12px 25px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color:#fff;
      text-decoration:none;
      border-radius:5px;
      margin-top:20px;
      font-weight:bold;
      transition: transform 0.25s ease, filter 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.2);
    }
    .btn:hover { transform:translateY(-2px); filter: brightness(1.07); box-shadow: 0 14px 28px rgba(0,0,0,0.26); }
    .btn:focus-visible { outline:2px solid var(--accent2); outline-offset:2px; }
    img.logo { width:150px; margin-bottom:20px; }
  </style>
</head>
<body>
  <div class="container">
    <img src="davince-logo.png" alt="Davince Visuals Logo" class="logo">
    <h1>Thank You!</h1>
    <p>Your request has been submitted successfully. Our team will contact you soon.</p>
    <a href="https://davincevisuals.com/index.html" class="btn">Back to Home</a>
  </div>
</body>
</html>
