  <style>
    :root {
      --nav-height: 64px;
      /* New palette */
      --deep-navy: #0C3B56;
      --charcoal: #4B565E;
      --sunset-orange: #FF9732;
      --vibrant-orange: #FF6424;
      --muted-teal: #4F8F88;
      --deep-teal: #267A79;
      /* Theme tokens */
      --bg: #071e2c;
      --surface: rgba(12, 59, 86, 0.82);
      --text: #e8f4f8;
      --muted: #8fb8c8;
      --accent: #FF9732;
      --accent-hover: #FF6424;
      --accent2: #4F8F88;
      --border: rgba(38, 122, 121, 0.45);
      --input-bg: rgba(7, 30, 44, 0.75);
      --input-border: rgba(79, 143, 136, 0.5);
      --gradient-primary: linear-gradient(135deg, #071e2c 0%, #0C3B56 50%, #267A79 100%);
      --gradient-accent: linear-gradient(135deg, #FF9732 0%, #FF6424 100%);
      --gradient-teal: linear-gradient(135deg, #267A79 0%, #4F8F88 100%);
      --overlay-navy: rgba(12, 59, 86, 0.65);
      --overlay-teal: rgba(38, 122, 121, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text);
      background-color: #071e2c;
      background: var(--gradient-primary);
      background-attachment: fixed;
      min-height: 100vh;
    }

    body.light-mode {
      --bg: #e8f4f8;
      --surface: rgba(232, 244, 248, 0.92);
      --text: #071e2c;
      --muted: #4B565E;
      --accent: #FF6424;
      --accent-hover: #e0501a;
      --accent2: #267A79;
      --border: rgba(38, 122, 121, 0.35);
      --input-bg: rgba(255, 255, 255, 0.85);
      --input-border: rgba(79, 143, 136, 0.5);
      --gradient-primary: linear-gradient(135deg, #c8e6f0 0%, #e8f4f8 50%, #b8dbd8 100%);
      background-color: #e8f4f8;
      background: linear-gradient(135deg, #c8e6f0 0%, #e8f4f8 50%, #b8dbd8 100%);
    }

    /* Skip to Content Link */
    .skip-to-content {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--accent);
      color: #fff;
      padding: 8px 16px;
      text-decoration: none;
      z-index: 100;
      border-radius: 0 0 6px 0;
    }

    .skip-to-content:focus {
      top: 0;
    }

    /* Header & Navigation */
    header {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      background: url("background.jpg") no-repeat center top;
      background-size: cover;
      background-attachment: fixed;
    }

    header::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(12,59,86,0.72) 0%, rgba(7,30,44,0.55) 50%, rgba(38,122,121,0.65) 100%);
      pointer-events: none;
    }

    header img.logo { 
      width: 180px; 
      margin-bottom: 20px; 
      z-index: 1; 
    }

    header h1 { 
      font-size: 3.5em; 
      margin: 0; 
      color: var(--accent); 
      animation: fadeInDown 2s; 
      z-index: 1; 
    }

    header p { 
      font-size: 1.3em; 
      color: var(--accent2); 
      animation: fadeInUp 2s; 
      z-index: 1; 
    }
    
    nav { 
      position: fixed; 
      top: 0; 
      width: 100%; 
      background: rgba(12, 59, 86, 0.88); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px 20px; 
      text-align: center; 
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 2px 16px rgba(7,30,44,0.4), 0 1px 0 rgba(38,122,121,0.3);
      border-bottom: 1px solid rgba(38, 122, 121, 0.3);
    }

    .nav-brand {
      font-weight: bold;
      color: var(--accent);
      font-size: 1.1em;
      margin-right: auto;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a, nav button.theme-toggle { 
      margin: 0 8px;
      color: var(--text); 
      text-decoration: none; 
      font-weight: bold; 
      transition: color 0.3s ease, background 0.3s ease, transform 0.3s ease; 
      font-size: 0.9em;
      padding: 8px 12px;
      border-radius: 4px;
    }

    nav a:focus, nav button.theme-toggle:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    nav a:hover, nav button.theme-toggle:hover { 
      color: var(--accent); 
      transform: translateY(-1px);
      background: rgba(255, 151, 50, 0.12);
    }

    nav button.theme-toggle {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      min-width: 110px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    nav button.theme-toggle:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    body.light-mode nav button.theme-toggle {
      border-color: rgba(0,0,0,0.15);
      background: rgba(0,0,0,0.06);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    /* Mobile Menu Toggle */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5em;
      cursor: pointer;
      padding: 8px 12px;
      z-index: 1001;
    }

    .menu-toggle:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Layout Sections */
    section { 
      padding: 80px 20px; 
      max-width: 1100px; 
      margin: auto; 
      scroll-margin-top: calc(var(--nav-height) + 16px); 
    }

    section h2 {
      font-size: 2.1em;
      margin: 0 0 20px 0;
      border-bottom: 2px solid var(--accent);
      display: block;
      position: sticky;
      top: calc(var(--nav-height) + 12px);
      z-index: 900;
      background: rgba(12, 59, 86, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(7,30,44,0.3);
    }
    
    /* Grid Systems */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 30px; 
    }

    .card { 
      background: rgba(12, 59, 86, 0.65); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 25px; 
      border-radius: 10px; 
      border: 1px solid rgba(38, 122, 121, 0.4); 
      text-align: center; 
      transition: 0.3s ease;
    }

    .card:hover { 
      border-color: var(--accent); 
      background: rgba(12, 59, 86, 0.82);
      transform: translateY(-5px);
      box-shadow: 0 8px 32px rgba(7,30,44,0.4), 0 0 0 1px rgba(255,151,50,0.2);
    }

    .card:focus-within {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .card h3 { 
      color: var(--accent); 
      margin-top: 0; 
    }

    .price { 
      font-size: 1.5em; 
      color: var(--accent); 
      font-weight: bold; 
      margin: 15px 0; 
    }

    .feature-list { 
      list-style: none; 
      padding: 0; 
      margin: 15px 0 0; 
      color: #a8ccd8; 
      font-size: 0.95em; 
    }

    .feature-list li { 
      margin-bottom: 10px; 
      padding-left: 22px; 
      position: relative; 
    }

    .feature-list li::before { 
      content: '✓'; 
      position: absolute; 
      left: 0; 
      color: var(--accent); 
    }

    .store-actions { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 12px; 
      margin-top: 20px; 
    }

    .store-actions .btn, 
    .store-actions button { 
      flex: 1 1 160px; 
      width: auto; 
    }

    .store-actions form { 
      margin: 0; 
      flex: 1 1 160px;
    }

    .store-card img { 
      border-radius: 10px; 
      margin-bottom: 18px; 
      width: 100%;
      max-height: 200px;
      object-fit: cover;
    }

    .preview-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
      gap: 24px; 
      margin-top: 30px; 
    }

    .preview-card, 
    .testimonial-card { 
      background: rgba(12, 59, 86, 0.65); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(38, 122, 121, 0.4); 
      border-radius: 14px; 
      padding: 24px; 
    }

    .preview-card h3, 
    .testimonial-card h3 { 
      margin-top: 0; 
      color: var(--accent); 
    }

    .video-box { 
      border-radius: 12px; 
      overflow: hidden; 
      margin: 18px 0; 
      background: #000; 
    }

    .video-box iframe { 
      width: 100%; 
      height: 200px; 
      border: 0; 
    }

    .testimonial-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 22px; 
      margin-top: 24px; 
    }

    .testimonial-card p { 
      color: #c8e0ea; 
      line-height: 1.7; 
    }

    .testimonial-stars { 
      color: var(--accent); 
      margin-bottom: 12px; 
      font-size: 1.2em;
    }

    .testimonial-author { 
      margin-top: 16px; 
      color: var(--muted-teal); 
      font-size: 0.95em; 
    }

    body.light-mode .preview-card, 
    body.light-mode .testimonial-card { 
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(38, 122, 121, 0.35);
    }

    body.light-mode .testimonial-card p { 
      color: var(--text); 
    }

    /* Gallery */
    .gallery { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 20px; 
    }

    .gallery img, 
    .gallery video { 
      width: 100%; 
      border-radius: 8px; 
      cursor: zoom-in; 
      transition: transform 0.3s ease;
      height: auto;
    }

    .gallery img:hover, 
    .gallery video:hover { 
      transform: scale(1.03); 
    }

    .gallery img:focus,
    .gallery video:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .video-container { 
      position: relative; 
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }

    .video-container iframe { 
      position: absolute;
      top: 0;
      left: 0;
      width: 100%; 
      height: 100%;
      border-radius: 8px; 
      pointer-events: none; 
    }

    .video-trigger {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      transition: background 0.2s ease;
      z-index: 2;
      border: none;
      font-size: 3rem;
      color: #fff;
      text-shadow: 0 0 18px rgba(0,0,0,0.7);
    }

    .video-trigger:hover { 
      background: rgba(0, 0, 0, 0.35); 
    }

    .video-trigger:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .before-after-wrap { 
      max-width: 1000px; 
      margin: 40px auto 0; 
    }

    .compare-block { 
      margin-bottom: 32px; 
    }

    .compare-labels { 
      display: flex; 
      justify-content: space-between; 
      color: var(--muted); 
      margin-bottom: 14px; 
      font-size: 0.95rem; 
    }

    .compare-slider { 
      position: relative; 
      overflow: hidden; 
      border-radius: 14px;
      line-height: 0;
      aspect-ratio: 16 / 10;
      background: #0b1f2b;
    }

    .compare-slider > picture,
    .compare-slider .after-image > picture {
      display: block;
      width: 100%;
      height: 100%;
    }

    .compare-slider > picture img,
    .compare-slider .after-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fade-in-up { 
      opacity: 0; 
      transform: translateY(30px); 
      transition: opacity 0.9s ease, transform 0.9s ease; 
    }

    .fade-in-up.visible { 
      opacity: 1; 
      transform: translateY(0); 
    }

    .after-image { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 50%; 
      height: 100%; 
      overflow: hidden;
      z-index: 1;
    }

    .after-image img { 
      display: block; 
      width: 100%; 
      height: 100%;
      object-fit: cover;
    }

    .slider-handle { 
      position: absolute; 
      top: 0; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 4px; 
      height: 100%; 
      background: rgba(255,255,255,0.9); 
      cursor: ew-resize; 
      z-index: 2; 
      box-shadow: 0 0 10px rgba(255,255,255,0.3); 
      transition: box-shadow 0.2s ease; 
    }

    .slider-handle:hover { 
      background: rgba(255,255,255,1); 
      box-shadow: 0 0 18px rgba(255,255,255,0.6); 
    }

    .slider-handle::before { 
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50%;
      transition: box-shadow 0.25s ease;
    }

    .slider-handle:hover::before { 
      box-shadow: 0 0 18px rgba(255,255,255,0.5); 
    }

    .light-mode .before-after-wrap .compare-labels,
    .light-mode .before-after-wrap .slider-handle,
    .light-mode .before-after-wrap .slider-handle::before {
      color: #333;
      background: rgba(0,0,0,0.08);
      border-color: rgba(0,0,0,0.15);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
      overflow: hidden;
    }

    .lightbox.active { 
      display: flex; 
    }

    .lightbox img, 
    .lightbox .video-wrapper { 
      max-width: 100%; 
      max-height: 100%; 
      border-radius: 12px; 
      box-shadow: 0 30px 80px rgba(0,0,0,0.7); 
    }

    .lightbox .video-wrapper { 
      display: none; 
      width: 100%; 
      height: 100%; 
    }

    .lightbox .video-wrapper.active { 
      display: block; 
    }

    .lightbox .video-wrapper iframe { 
      width: 100%; 
      height: 100%; 
      border: 0; 
      border-radius: 12px; 
    }

    .lightbox .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1.6rem;
      transition: background 0.2s ease, transform 0.2s ease;
      z-index: 2100;
    }

    .lightbox .nav-btn:hover { 
      background: rgba(255,255,255,0.16); 
      transform: translateY(-50%) scale(1.05); 
    }

    .lightbox .nav-btn:focus {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .lightbox .nav-btn.prev { 
      left: 20px; 
    }

    .lightbox .nav-btn.next { 
      right: 20px; 
    }

    .lightbox .caption {
      position: absolute;
      bottom: 30px;
      left: 50%;
