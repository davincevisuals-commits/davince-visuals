<head>

  <style>
    :root {
      --nav-height: 64px;
      /* Palette from user image */
      --burnt-orange: #d15c00;
      --golden-orange: #fca311;
      --light-blue: #c4d3e6;
      --bright-teal: #00bfd1;
      --soft-gray: #9ea9ad;
      /* Theme tokens */
      --bg: #eaf2f8;
      --surface: rgba(255, 255, 255, 0.88);
      --text: #24404a;
      --muted: #5f7480;
      --accent: var(--burnt-orange);
      --accent-hover: #b54f00;
      --accent2: var(--bright-teal);
      --border: rgba(0, 191, 209, 0.28);
      --input-bg: rgba(255, 255, 255, 0.9);
      --input-border: rgba(196, 211, 230, 0.9);
      --gradient-primary: linear-gradient(135deg, #f7fbff 0%, #dce8f3 45%, #c4d3e6 100%);
      --gradient-accent: linear-gradient(135deg, var(--golden-orange) 0%, var(--burnt-orange) 100%);
      --gradient-teal: linear-gradient(135deg, #00bfd1 0%, #54dbe8 100%);
      --overlay-navy: rgba(44, 64, 74, 0.62);
      --overlay-teal: rgba(0, 191, 209, 0.32);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text);
      background-color: var(--bg);
      background: var(--gradient-primary);
      background-attachment: fixed;
      min-height: 100vh;
    }

    body.light-mode {
      --bg: #f5f8fb;
      --surface: rgba(255, 255, 255, 0.95);
      --text: #24353d;
      --muted: #5f7480;
      --accent: var(--burnt-orange);
      --accent-hover: #b54f00;
      --accent2: var(--bright-teal);
      --border: rgba(0, 191, 209, 0.22);
      --input-bg: rgba(255, 255, 255, 0.96);
      --input-border: rgba(196, 211, 230, 0.95);
      --gradient-primary: linear-gradient(135deg, #ffffff 0%, #eaf2f8 50%, #dce8f3 100%);
      background-color: #f5f8fb;
      background: linear-gradient(135deg, #ffffff 0%, #eaf2f8 50%, #dce8f3 100%);
    }

    .skip-to-content {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--accent);
      color: #fff;
      padding: 8px 16px;
      text-decoration: none;
      z-index: 100;
      border-radius: 0 0 6px 0;
    }
    .skip-to-content:focus { top: 0; }

    header {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      background: url("background.jpg") no-repeat center top;
      background-size: cover;
      background-attachment: fixed;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(44,64,74,0.68) 0%, rgba(196,211,230,0.18) 55%, rgba(0,191,209,0.22) 100%);
      pointer-events: none;
    }

    header img.logo { width: 180px; margin-bottom: 20px; z-index: 1; }
    header h1 { font-size: 3.5em; margin: 0; color: var(--golden-orange); animation: fadeInDown 2s; z-index: 1; }
    header p { font-size: 1.3em; color: var(--bright-teal); animation: fadeInUp 2s; z-index: 1; }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(44, 64, 74, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px 20px;
      text-align: center;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 2px 16px rgba(44,64,74,0.25), 0 1px 0 rgba(0,191,209,0.22);
      border-bottom: 1px solid rgba(196, 211, 230, 0.3);
    }

    .nav-brand { font-weight: bold; color: var(--golden-orange); font-size: 1.1em; margin-right: auto; }
    .nav-links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    nav a, nav button.theme-toggle {
      margin: 0 8px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease, background 0.3s ease, transform 0.3s ease;
      font-size: 0.9em;
      padding: 8px 12px;
      border-radius: 4px;
    }

    nav a:hover, nav button.theme-toggle:hover {
      color: var(--golden-orange);
      transform: translateY(-1px);
      background: rgba(252, 163, 17, 0.14);
    }

    nav button.theme-toggle {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      min-width: 110px;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5em;
      cursor: pointer;
      padding: 8px 12px;
      z-index: 1001;
    }

    section {
      padding: 80px 20px;
      max-width: 1100px;
      margin: auto;
      scroll-margin-top: calc(var(--nav-height) + 16px);
    }

    section h2 {
      font-size: 2.1em;
      margin: 0 0 20px 0;
      border-bottom: 2px solid var(--golden-orange);
      display: block;
      position: sticky;
      top: calc(var(--nav-height) + 12px);
      z-index: 900;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(44,64,74,0.1);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .card,
    .preview-card,
    .testimonial-card {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 25px;
      border-radius: 10px;
      border: 1px solid rgba(196, 211, 230, 0.8);
      text-align: center;
      transition: 0.3s ease;
      box-shadow: 0 12px 30px rgba(44,64,74,0.08);
    }

    .card:hover {
      border-color: var(--golden-orange);
      transform: translateY(-5px);
      box-shadow: 0 8px 32px rgba(44,64,74,0.14), 0 0 0 1px rgba(252,163,17,0.18);
    }

    .card h3, .preview-card h3, .testimonial-card h3, .price {
      color: var(--burnt-orange);
    }

    .feature-list {
      list-style: none;
      padding: 0;
      margin: 15px 0 0;
      color: #5f7480;
      font-size: 0.95em;
    }

    .feature-list li { margin-bottom: 10px; padding-left: 22px; position: relative; }
    .feature-list li::before { content: '✓'; position: absolute; left: 0; color: var(--bright-teal); }

    .store-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .store-actions .btn, .store-actions button { flex: 1 1 160px; width: auto; }
    .store-actions form { margin: 0; flex: 1 1 160px; }

    .store-card img, .gallery img, .gallery video {
      border-radius: 10px;
      width: 100%;
      object-fit: cover;
    }

    .preview-grid, .testimonial-grid, .gallery {
      display: grid;
      gap: 24px;
      margin-top: 30px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .video-box { border-radius: 12px; overflow: hidden; margin: 18px 0; background: #000; }
    .video-box iframe { width: 100%; height: 200px; border: 0; }

    .testimonial-card p { color: #4b5f6a; line-height: 1.7; }
    .testimonial-stars { color: var(--golden-orange); margin-bottom: 12px; font-size: 1.2em; }
    .testimonial-author { margin-top: 16px; color: var(--bright-teal); font-size: 0.95em; }

    .compare-slider { position: relative; overflow: hidden; border-radius: 14px; line-height: 0; aspect-ratio: 16 / 10; background: #c4d3e6; }
    .after-image { position: absolute; inset: 0 auto 0 0; width: 50%; height: 100%; overflow: hidden; z-index: 1; }
    .slider-handle {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 4px; height: 100%; background: rgba(255,255,255,0.95);
      cursor: ew-resize; z-index: 2;
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 2000; overflow: hidden; }
    .lightbox.active { display: flex; }

    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      .nav-links { display: none; width: 100%; justify-content: center; padding-top: 10px; }
      .nav-links.open { display: flex; }
      header h1 { font-size: 2.4em; }
      header p { font-size: 1em; }
    }
  </style>
</head>

  <nav>

    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#contact">Contact</a>
      <button class="theme-toggle">Toggle Theme</button>
    </div>
  </nav>
  <header>
    <img src="davince-logo.png" alt="Davince Visuals logo" class="logo">
    <h1>Davince Visuals</h1>
    <p>Creative storytelling through photography, film, and digital art</p>
  </header>
  <main id="main">
    <!-- existing site content remains below -->
  </main>
</body>
</html>
