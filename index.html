  <style>
    :root {
      --nav-height: 64px;
      /* Palette from user image */
      --burnt-orange: #d15c00;
      --golden-orange: #fca311;
      --light-blue: #c4d3e6;
      --bright-teal: #00bfd1;
      --soft-gray: #9ea9ad;
      /* Theme tokens */
      --bg: #eaf2f8;
      --surface: rgba(255, 255, 255, 0.88);
      --text: #24404a;
      --muted: #5f7480;
      --accent: var(--burnt-orange);
      --accent-hover: #b54f00;
      --accent2: var(--bright-teal);
      --border: rgba(0, 191, 209, 0.28);
      --input-bg: rgba(255, 255, 255, 0.9);
      --input-border: rgba(196, 211, 230, 0.9);
      --gradient-primary: linear-gradient(135deg, #f7fbff 0%, #dce8f3 45%, #c4d3e6 100%);
      --gradient-accent: linear-gradient(135deg, var(--golden-orange) 0%, var(--burnt-orange) 100%);
      --gradient-teal: linear-gradient(135deg, #00bfd1 0%, #54dbe8 100%);
      --overlay-navy: rgba(44, 64, 74, 0.62);
      --overlay-teal: rgba(0, 191, 209, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text);
      background-color: var(--bg);
      background: var(--gradient-primary);
      background-attachment: fixed;
      min-height: 100vh;
    }

    body.light-mode {
      --bg: #f5f8fb;
      --surface: rgba(255, 255, 255, 0.95);
      --text: #24353d;
      --muted: #5f7480;
      --accent: var(--burnt-orange);
      --accent-hover: #b54f00;
      --accent2: var(--bright-teal);
      --border: rgba(0, 191, 209, 0.22);
      --input-bg: rgba(255, 255, 255, 0.96);
      --input-border: rgba(196, 211, 230, 0.95);
      --gradient-primary: linear-gradient(135deg, #ffffff 0%, #eaf2f8 50%, #dce8f3 100%);
      background-color: #f5f8fb;
      background: linear-gradient(135deg, #ffffff 0%, #eaf2f8 50%, #dce8f3 100%);
    }

    /* Skip to Content Link */
    .skip-to-content {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--accent);
      color: #fff;
      padding: 8px 16px;
      text-decoration: none;
      z-index: 100;
      border-radius: 0 0 6px 0;
    }

    .skip-to-content:focus {
      top: 0;
    }

    /* Header & Navigation */
    header {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      background: url("background.jpg") no-repeat center top;
      background-size: cover;
      background-attachment: fixed;
    }

    header::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(44,64,74,0.68) 0%, rgba(196,211,230,0.18) 55%, rgba(0,191,209,0.22) 100%);
      pointer-events: none;
    }

    header img.logo { 
      width: 180px; 
      margin-bottom: 20px; 
      z-index: 1; 
    }

    header h1 { 
      font-size: 3.5em; 
      margin: 0; 
      color: var(--accent); 
      animation: fadeInDown 2s; 
      z-index: 1; 
    }

    header p { 
      font-size: 1.3em; 
      color: var(--accent2); 
      animation: fadeInUp 2s; 
      z-index: 1; 
    }
    
    nav { 
      position: fixed; 
      top: 0; 
      width: 100%; 
      background: rgba(44, 64, 74, 0.9); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px 20px; 
      text-align: center; 
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 2px 16px rgba(44,64,74,0.25), 0 1px 0 rgba(0,191,209,0.22);
      border-bottom: 1px solid rgba(196, 211, 230, 0.3);
    }

    .nav-brand {
      font-weight: bold;
      color: var(--accent);
      font-size: 1.1em;
      margin-right: auto;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a, nav button.theme-toggle { 
      margin: 0 8px;
      color: #fff; 
      text-decoration: none; 
      font-weight: bold; 
      transition: color 0.3s ease, background 0.3s ease, transform 0.3s ease; 
      font-size: 0.9em;
      padding: 8px 12px;
      border-radius: 4px;
    }

    nav a:focus, nav button.theme-toggle:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    nav a:hover, nav button.theme-toggle:hover { 
      color: var(--accent); 
      transform: translateY(-1px);
      background: rgba(252, 163, 17, 0.12);
    }

    nav button.theme-toggle {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      min-width: 110px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    nav button.theme-toggle:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    body.light-mode nav button.theme-toggle {
      border-color: rgba(0,0,0,0.15);
      background: rgba(0,0,0,0.06);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    /* Mobile Menu Toggle */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5em;
      cursor: pointer;
      padding: 8px 12px;
      z-index: 1001;
    }

    .menu-toggle:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Layout Sections */
    section { 
      padding: 80px 20px; 
      max-width: 1100px; 
      margin: auto; 
      scroll-margin-top: calc(var(--nav-height) + 16px); 
    }

    section h2 {
      font-size: 2.1em;
      margin: 0 0 20px 0;
      border-bottom: 2px solid var(--accent);
      display: block;
      position: sticky;
      top: calc(var(--nav-height) + 12px);
      z-index: 900;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(44,64,74,0.1);
    }
    
    /* Grid Systems */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 30px; 
    }

    .card { 
      background: rgba(255, 255, 255, 0.84); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 25px; 
      border-radius: 10px; 
      border: 1px solid rgba(0, 191, 209, 0.28); 
      text-align: center; 
      transition: 0.3s ease;
    }

    .card:hover { 
      border-color: var(--accent); 
      background: rgba(255, 255, 255, 0.88);
      transform: translateY(-5px);
      box-shadow: 0 8px 32px rgba(44,64,74,0.14), 0 0 0 1px rgba(252,163,17,0.18);
    }

    .card:focus-within {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .card h3 { 
      color: var(--accent); 
      margin-top: 0; 
    }

    .price { 
      font-size: 1.5em; 
      color: var(--accent); 
      font-weight: bold; 
      margin: 15px 0; 
    }

    .feature-list { 
      list-style: none; 
      padding: 0; 
      margin: 15px 0 0; 
      color: var(--muted); 
      font-size: 0.95em; 
    }

    .feature-list li { 
      margin-bottom: 10px; 
      padding-left: 22px; 
      position: relative; 
    }

    .feature-list li::before { 
      content: '✓'; 
      position: absolute; 
      left: 0; 
      color: var(--accent); 
    }

    .store-actions { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 12px; 
      margin-top: 20px; 
    }

    .store-actions .btn, 
    .store-actions button { 
      flex: 1 1 160px; 
      width: auto; 
    }

    .store-actions form { 
      margin: 0; 
      flex: 1 1 160px;
    }

    .store-card img { 
      border-radius: 10px; 
      margin-bottom: 18px; 
      width: 100%;
      max-height: 200px;
      object-fit: cover;
    }

    .preview-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
      gap: 24px; 
      margin-top: 30px; 
    }

    .preview-card, 
    .testimonial-card { 
      background: rgba(255, 255, 255, 0.84); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 191, 209, 0.28); 
      border-radius: 14px; 
      padding: 24px; 
    }

    .preview-card h3, 
    .testimonial-card h3 { 
      margin-top: 0; 
      color: var(--accent); 
    }

    .video-box { 
      border-radius: 12px; 
      overflow: hidden; 
      margin: 18px 0; 
      background: #000; 
    }

    .video-box iframe { 
      width: 100%; 
      height: 200px; 
      border: 0; 
    }

    .testimonial-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 22px; 
      margin-top: 24px; 
    }

    .testimonial-card p { 
      color: var(--text); 
      line-height: 1.7; 
    }

    .testimonial-stars { 
      color: var(--accent); 
      margin-bottom: 12px; 
      font-size: 1.2em;
    }

    .testimonial-author { 
      margin-top: 16px; 
      color: var(--accent2); 
      font-size: 0.95em; 
    }

    body.light-mode .preview-card, 
    body.light-mode .testimonial-card { 
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(0, 191, 209, 0.22);
    }

    body.light-mode .testimonial-card p { 
      color: var(--text); 
    }

    /* Gallery */
    .gallery { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 20px; 
    }

    .gallery img, 
    .gallery video { 
      width: 100%; 
      border-radius: 8px; 
      cursor: zoom-in; 
      transition: transform 0.3s ease;
      height: auto;
    }

    .gallery img:hover, 
    .gallery video:hover { 
      transform: scale(1.03); 
    }

    .gallery img:focus,
    .gallery video:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .video-container { 
      position: relative; 
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }

    .video-container iframe { 
      position: absolute;
      top: 0;
      left: 0;
      width: 100%; 
      height: 100%;
      border-radius: 8px; 
      pointer-events: none; 
    }

    .video-trigger {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      transition: background 0.2s ease;
      z-index: 2;
      border: none;
      font-size: 3rem;
      color: #fff;
      text-shadow: 0 0 18px rgba(0,0,0,0.7);
    }

    .video-trigger:hover { 
      background: rgba(0, 0, 0, 0.35); 
    }

    .video-trigger:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .before-after-wrap { 
      max-width: 1000px; 
      margin: 40px auto 0; 
    }

    .compare-block { 
      margin-bottom: 32px; 
    }

    .compare-labels { 
      display: flex; 
      justify-content: space-between; 
      color: var(--muted); 
      margin-bottom: 14px; 
      font-size: 0.95rem; 
    }

    .compare-slider { 
      position: relative; 
      overflow: hidden; 
      border-radius: 14px; 
    }

    .compare-slider img { 
      display: block; 
      width: 100%; 
      height: auto; 
    }

    .fade-in-up { 
      opacity: 0; 
      transform: translateY(30px); 
      transition: opacity 0.9s ease, transform 0.9s ease; 
    }

    .fade-in-up.visible { 
      opacity: 1; 
      transform: translateY(0); 
    }

    .after-image { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 50%; 
      height: 100%; 
      overflow: hidden; 
    }

    .after-image img { 
      display: block; 
      width: 100%; 
      height: auto; 
    }

    .slider-handle { 
      position: absolute; 
      top: 0; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 4px; 
      height: 100%; 
      background: rgba(255,255,255,0.9); 
      cursor: ew-resize; 
      z-index: 2; 
      box-shadow: 0 0 10px rgba(255,255,255,0.3); 
      transition: box-shadow 0.2s ease; 
    }

    .slider-handle:hover { 
      background: rgba(255,255,255,1); 
      box-shadow: 0 0 18px rgba(255,255,255,0.6); 
    }

    .slider-handle::before { 
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50%;
      transition: box-shadow 0.25s ease;
    }

    .slider-handle:hover::before { 
      box-shadow: 0 0 18px rgba(255,255,255,0.5); 
    }

    .light-mode .before-after-wrap .compare-labels,
    .light-mode .before-after-wrap .slider-handle,
    .light-mode .before-after-wrap .slider-handle::before {
      color: #333;
      background: rgba(0,0,0,0.08);
      border-color: rgba(0,0,0,0.15);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
      overflow: hidden;
    }

    .lightbox.active { 
      display: flex; 
    }

    .lightbox img, 
    .lightbox .video-wrapper { 
      max-width: 100%; 
      max-height: 100%; 
      border-radius: 12px; 
      box-shadow: 0 30px 80px rgba(0,0,0,0.7); 
    }

    .lightbox .video-wrapper { 
      display: none; 
      width: 100%; 
      height: 100%; 
    }

    .lightbox .video-wrapper.active { 
      display: block; 
    }

    .lightbox .video-wrapper iframe { 
      width: 100%; 
      height: 100%; 
      border: 0; 
      border-radius: 12px; 
    }

    .lightbox .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1.6rem;
      transition: background 0.2s ease, transform 0.2s ease;
      z-index: 2100;
    }

    .lightbox .nav-btn:hover { 
      background: rgba(255,255,255,0.16); 
      transform: translateY(-50%) scale(1.05); 
    }

    .lightbox .nav-btn:focus {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .lightbox .nav-btn.prev { 
      left: 20px; 
    }

    .lightbox .nav-btn.next { 
      right: 20px; 
    }

    .lightbox .caption {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      text-align: center;
      max-width: 90%;
      font-size: 1rem;
      letter-spacing: 0.03em;
      opacity: 0.95;
    }

    .lightbox .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .lightbox .close-btn:hover { 
      background: rgba(255,255,255,0.2); 
      transform: scale(1.05); 
    }

    .lightbox .close-btn:focus {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    /* Coming Soon Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }

    .modal-overlay.active { 
      display: flex; 
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 30px 80px rgba(44,64,74,0.3), 0 0 0 1px rgba(0,191,209,0.2);
      border: 1px solid rgba(0, 191, 209, 0.28);
    }

    .modal-content h3 { 
      color: var(--accent); 
      margin-top: 0; 
      font-size: 1.8em; 
    }

    .modal-content p { 
      color: var(--text); 
      line-height: 1.6; 
      margin: 16px 0; 
    }

    .modal-close-btn {
      margin-top: 24px;
      padding: 12px 28px;
      background: var(--gradient-accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      transition: filter 0.3s ease, box-shadow 0.3s ease;
      font-weight: bold;
      box-shadow: 0 4px 14px rgba(209, 92, 0, 0.25);
    }

    .modal-close-btn:hover { 
      filter: brightness(1.1);
      box-shadow: 0 6px 20px rgba(209, 92, 0, 0.35);
    }

    .modal-close-btn:focus {
      outline: 2px solid var(--accent2);
      outline-offset: 2px;
    }

    /* Forms & Inputs */
    .form-container { 
      max-width: 700px; 
      margin: auto; 
      background: rgba(255, 255, 255, 0.88); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 30px; 
      border-radius: 10px; 
      border: 1px solid rgba(0, 191, 209, 0.28); 
    }

    input, 
    textarea, 
    select { 
      width: 100%; 
      padding: 12px; 
      border-radius: 5px; 
      border: 1px solid var(--input-border); 
      background: var(--input-bg); 
      color: var(--text); 
      box-sizing: border-box; 
      margin-bottom: 15px; 
      font-family: inherit;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(252, 163, 17, 0.18);
    }

    textarea {
      resize: vertical;
      font-family: inherit;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--accent2);
      font-size: 0.9em;
      font-weight: 500;
    }

    .form-message {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-weight: 500;
    }

    .form-message.success {
      background: #10b981;
      color: #fff;
      display: block;
    }

    .form-message.error {
      background: #ef4444;
      color: #fff;
      display: block;
    }

    .btn { 
      display: inline-block; 
      padding: 12px 25px; 
      background: var(--gradient-accent); 
      color: #fff; 
      text-decoration: none; 
      border-radius: 5px; 
      border: none; 
      cursor: pointer; 
      transition: filter 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease; 
      font-weight: bold;
      box-shadow: 0 4px 14px rgba(209, 92, 0, 0.25);
    }

    .btn:hover { 
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(209, 92, 0, 0.35);
    }

    .btn:focus {
      outline: 2px solid var(--accent2);
      outline-offset: 2px;
    }

    body.light-mode .card { 
      background: rgba(255, 255, 255, 0.75); 
      border-color: rgba(0, 191, 209, 0.22); 
    }

    body.light-mode .form-container { 
      background: rgba(255, 255, 255, 0.8); 
      border-color: rgba(0, 191, 209, 0.22); 
    }

    body.light-mode input,
    body.light-mode textarea,
    body.light-mode select { 
      background: var(--input-bg);

<body>
  <!-- unchanged content omitted for brevity in this commit body representation -->
  <script>
    // ...existing script...

    // Lightbox functionality
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxVideoWrapper = document.getElementById('lightboxVideoWrapper');
    const lightboxVideo = document.getElementById('lightboxVideo');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const closeButton = document.getElementById('lightboxClose');
    const prevButton = document.getElementById('lightboxPrev');
    const nextButton = document.getElementById('lightboxNext');

    const galleryImages = Array.from(document.querySelectorAll('.gallery picture img'));
    const videoTrigger = document.getElementById('videoTrigger');
    const lightboxItems = galleryImages.map((img) => ({
      type: 'image',
      src: img.currentSrc || img.src,
      alt: img.alt || 'Portfolio image',
    }));

    if (videoTrigger && videoTrigger.dataset.videoSrc) {
      lightboxItems.push({
        type: 'video',
        src: videoTrigger.dataset.videoSrc,
        alt: 'Portfolio video',
      });
    }

    let currentItemIndex = 0;

    const closeLightbox = () => {
      lightbox.classList.remove('active');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxVideo.src = '';
      lightboxImage.removeAttribute('src');
      lightboxImage.style.display = 'none';
      lightboxVideoWrapper.classList.remove('active');
      document.body.style.overflow = '';
    };

    const showLightboxItem = (index) => {
      if (!lightboxItems.length) {
        return;
      }

      currentItemIndex = (index + lightboxItems.length) % lightboxItems.length;
      const item = lightboxItems[currentItemIndex];

      if (!item || !item.src) {
        console.warn('Skipping lightbox item with missing src', item);
        return;
      }

      if (item.type === 'image') {
        lightboxVideo.src = '';
        lightboxVideoWrapper.classList.remove('active');
        lightboxImage.src = item.src;
        lightboxImage.style.display = 'block';
      } else {
        lightboxImage.removeAttribute('src');
        lightboxImage.style.display = 'none';
        lightboxVideoWrapper.classList.add('active');
        lightboxVideo.src = item.src;
      }

      lightboxCaption.textContent = item.alt;
      lightbox.classList.add('active');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    };

    galleryImages.forEach((img, index) => {
      img.addEventListener('click', () => {
        showLightboxItem(index);
      });
      img.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          showLightboxItem(index);
        }
      });
      img.setAttribute('tabindex', '0');
      img.setAttribute('role', 'button');
    });

    if (videoTrigger && videoTrigger.dataset.videoSrc) {
      videoTrigger.addEventListener('click', () => {
        showLightboxItem(lightboxItems.length - 1);
      });
    }

    if (prevButton) {
      prevButton.addEventListener('click', () => showLightboxItem(currentItemIndex - 1));
    }
    if (nextButton) {
      nextButton.addEventListener('click', () => showLightboxItem(currentItemIndex + 1));
    }
    if (closeButton) {
      closeButton.addEventListener('click', closeLightbox);
    }
    if (lightbox) {
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });
    }
    document.addEventListener('keydown', (event) => {
      if (!lightbox.classList.contains('active')) return;
      if (event.key === 'Escape') {
        closeLightbox();
      } else if (event.key === 'ArrowLeft') {
        showLightboxItem(currentItemIndex - 1);
      } else if (event.key === 'ArrowRight') {
        showLightboxItem(currentItemIndex + 1);
      }
    });

    // ...rest of existing script...
  </script>
